<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lời Chúc Dễ Thương</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { overflow: hidden; background: #2d5a1b; }

    canvas#bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    .overlay {
      position: fixed; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,60,0,0.25));
      z-index: 0;
    }

    .photo-float {
      position: fixed; z-index: 3; pointer-events: none;
    }

    .photo-float img {
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.85);
      box-shadow: 0 8px 32px rgba(0,100,0,0.35), 0 2px 8px rgba(0,0,0,0.25);
      display: block;
      animation: floatImg 4s ease-in-out infinite;
    }

    .p1 { top: 6vh; left: 2vw; }
    .p1 img { width: 130px; height: 145px; border-radius: 45% 55% 55% 45% / 50% 45% 55% 50%; }

    .p2 { top: 50vh; left: 1vw; }
    .p2 img { width: 115px; height: 140px; border-radius: 50%; animation-delay: 0.8s; }

    .p3 { top: 5vh; right: 2vw; }
    .p3 img { width: 120px; height: 120px; border-radius: 50%; animation-delay: 1.5s; }

    .p4 { top: 52vh; right: 1.5vw; }
    .p4 img { width: 125px; height: 130px; border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; animation-delay: 0.4s; }

    .p5 { bottom: 3vh; left: 50%; transform: translateX(-50%); }
    .p5 img { width: 100px; height: 125px; border-radius: 50% 50% 48% 52%; animation-delay: 1.1s; }

    @keyframes floatImg {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
      50%       { transform: translateY(-10px) rotate(1.5deg); }
    }

    .container {
      width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; text-align: center;
      padding: 20px; position: relative; z-index: 2;
    }

    .message-box {
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 28px 40px;
      border: 1.5px solid rgba(255,255,255,0.18);
    }

    .message {
      font-size: clamp(2rem, 5vw, 3.8rem);
      color: #fff; font-weight: bold;
      text-shadow: 0 0 20px rgba(144,238,144,0.7), 0 2px 8px rgba(0,0,0,0.4);
      animation: float 3s ease-in-out infinite;
      max-width: 700px; line-height: 1.5;
    }

    .sub {
      margin-top: 16px; color: #d4ffcc;
      font-size: 1.2rem; opacity: 0.95;
      text-shadow: 0 1px 6px rgba(0,0,0,0.3);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-12px); }
    }

    .emoji-fall {
      position: fixed; animation: fall linear infinite;
      opacity: 0.9; pointer-events: none; z-index: 1;
    }

    @keyframes fall {
      from { transform: translateY(-100px) rotate(0deg); }
      to   { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>

    resize();
    window.addEventListener('resize', () => { resize(); drawAll(); });

    // Vẽ 1 lá tim
    function drawHeart(cx, cy, size, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.bezierCurveTo(cx, cy - size*0.3, cx - size*0.5, cy - size*0.5, cx - size*0.5, cy - size*0.25);
      ctx.bezierCurveTo(cx - size*0.5, cy - size*0.6, cx, cy - size*0.6, cx, cy - size*0.25);
      ctx.bezierCurveTo(cx, cy - size*0.6, cx + size*0.5, cy - size*0.6, cx + size*0.5, cy - size*0.25);
      ctx.bezierCurveTo(cx + size*0.5, cy - size*0.5, cx, cy - size*0.3, cx, cy);
      ctx.fill();
      ctx.restore();
    }

    // Vẽ 1 lá cỏ 3 lá (3 hình tim xoay quanh 1 điểm + cuống)
    function drawClover(cx, cy, size, angle, alpha) {
      const colors = ['#3cb043','#4caf50','#56c45a','#2e7d32'];
      const col = colors[Math.floor(Math.random()*colors.length)];
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // 3 lá
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.rotate((i * 2 * Math.PI) / 3);
        // Lá hình bầu dục nhỏ
        ctx.globalAlpha = alpha;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.ellipse(0, -size * 0.55, size * 0.38, size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        // Gân lá
        ctx.globalAlpha = alpha * 0.4;
        ctx.strokeStyle = '#1a5c1a';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -size * 1.0);
        ctx.stroke();
        ctx.restore();
      }

      // Cuống
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#2e7d32';
      ctx.lineWidth = size * 0.12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(size * 0.4, size * 0.6, size * 0.2, size * 1.1);
      ctx.stroke();

      ctx.restore();
    }

    // Tạo danh sách cỏ 3 lá
    const clovers = [];
    function initClovers() {
      clovers.length = 0;
      const count = Math.floor((canvas.width * canvas.height) / 7000);
      for (let i = 0; i < count; i++) {
        clovers.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 22 + 10,
          angle: Math.random() * Math.PI * 2,
          alpha: Math.random() * 0.55 + 0.35,
          speed: (Math.random() - 0.5) * 0.003,
        });
      }
    }
    initClovers();

    function drawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gradient nền xanh cỏ
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#1b4d0f');
      grad.addColorStop(0.5, '#2d6e18');
      grad.addColorStop(1, '#1a3d0a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Vẽ cỏ 3 lá
      clovers.forEach(c => {
        drawClover(c.x, c.y, c.size, c.angle, c.alpha);
      });
    }

    // Animation: lá cỏ lắc nhẹ
    function animate() {
      clovers.forEach(c => { c.angle += c.speed; });
      drawAll();
      requestAnimationFrame(animate);
    }
    animate();

    /* ===== EMOJI RƠI ===== */
    const emojis = ['🍀','💖','✨','🌸','🎂'];
    for(let i = 0; i < 25; i++) {
      const item = document.createElement('div');
      item.classList.add('emoji-fall');
      item.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
      item.style.left = Math.random() * 100 + 'vw';
      item.style.fontSize = (Math.random() * 28 + 20) + 'px';
      item.style.animationDuration = (Math.random() * 5 + 5) + 's';
      item.style.animationDelay = Math.random() * 6 + 's';
      document.body.appendChild(item);
    }
  </script>
</body>
