<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lời Chúc Dễ Thương 💖</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Arial',sans-serif; }
    body { overflow:hidden; }

    audio#bgmusic { display:none; }

    #music-btn {
      position:fixed; bottom:18px; right:18px; z-index:999;
      background:rgba(255,255,255,0.25); backdrop-filter:blur(8px);
      border:2px solid rgba(255,255,255,0.5); border-radius:50%;
      width:48px; height:48px; font-size:22px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 15px rgba(0,0,0,0.2); transition:transform 0.2s;
    }
    #music-btn:hover { transform:scale(1.1); }

    #page-gift {
      position:fixed; inset:0;
      background:linear-gradient(135deg,#ffb6c1 0%,#ff85a1 40%,#ffccd5 70%,#ff69b4 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:10; transition:opacity 0.8s ease;
    }

    /* Phong cách cho hàng chờ đếm ngược */
    .countdown-container {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 20px 30px;
      border-radius: 20px;
      margin-top: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(200, 0, 80, 0.15);
      display: none; /* Sẽ hiển thị bằng JS nếu chưa đến giờ */
    }
    .countdown-title {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 10px;
      font-weight: bold;
      text-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .timer {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .time-box {
      background: rgba(255, 255, 255, 0.85);
      color: #ff5376;
      padding: 10px 14px;
      border-radius: 12px;
      min-width: 65px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .time-num {
      font-size: 1.6rem;
      font-weight: bold;
      display: block;
      line-height: 1.2;
    }
    .time-label {
      font-size: 0.75rem;
      color: #777;
      text-transform: uppercase;
    }

    .bubble {
      position:absolute; border-radius:50%;
      background:rgba(255,255,255,0.18);
      animation:riseBubble linear infinite;
    }
    @keyframes riseBubble {
      0%   { transform:translateY(0) scale(1); opacity:0.7; }
      100% { transform:translateY(-110vh) scale(1.2); opacity:0; }
    }

    .gift-wrapper {
      display:flex; flex-direction:column; align-items:center; gap:16px;
      cursor:pointer; animation:floatGift 3s ease-in-out infinite; user-select:none;
    }
    .gift-wrapper:hover .gift-box { transform:scale(1.07); }
    /* Trạng thái khi hộp quà bị khóa */
    .gift-wrapper.locked {
      cursor: not-allowed;
    }
    .gift-wrapper.locked:hover .gift-box {
      transform: none;
      animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes floatGift { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-18px); } }

    .gift-label {
      font-size:1.4rem; font-weight:bold; color:#fff;
      text-shadow:0 2px 10px rgba(200,0,80,0.35); letter-spacing:1px;
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
    .gift-box { transition:transform 0.3s ease; filter:drop-shadow(0 16px 32px rgba(200,0,80,0.3)); }
    .tap-hint { margin-top:8px; font-size:0.95rem; color:rgba(255,255,255,0.8); animation:pulse 2.5s ease-in-out infinite; }

    .confetti {
      position:absolute; border-radius:2px;
      animation:confettiFall linear infinite; pointer-events:none;
    }
    @keyframes confettiFall {
      0% { transform:translateY(-20px) rotate(0deg); opacity:1; }
      100% { transform:translateY(105vh) rotate(720deg); opacity:0.5; }
    }

    #page-wish {
      position:fixed; inset:0; z-index:5;
      opacity:0; pointer-events:none; transition:opacity 1s ease;
    }
    #page-wish.show { opacity:1; pointer-events:all; }

    canvas#bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; }
    .overlay2 {
      position:fixed; inset:0;
      background:linear-gradient(to bottom,rgba(0,0,0,0.15),rgba(0,60,0,0.25)); z-index:0;
    }

    .photo-float { position:fixed; z-index:3; pointer-events:none; }
    .photo-float img {
      object-fit:cover; border:4px solid rgba(255,255,255,0.88);
      box-shadow:0 10px 36px rgba(0,100,0,0.4),0 3px 10px rgba(0,0,0,0.25);
      display:block; animation:floatImg 4s ease-in-out infinite;
    }
    .p1 { top:5vh; left:1vw; } .p1 img { width:200px; height:220px; border-radius:45% 55% 55% 45%/50% 45% 55% 50%; }
    .p2 { top:53vh; left:0.5vw; } .p2 img { width:185px; height:215px; border-radius:50%; animation-delay:0.8s; }
    .p3 { top:5vh; right:1vw; } .p3 img { width:195px; height:195px; border-radius:50%; animation-delay:1.5s; }
    .p4 { top:52vh; right:0.5vw; } .p4 img { width:200px; height:210px; border-radius:40% 60% 60% 40%/40% 40% 60% 60%; animation-delay:0.4s; }
    .p5 { bottom:1vh; left:50%; transform:translateX(-50%); } .p5 img { width:170px; height:205px; border-radius:50% 50% 48% 52%; animation-delay:1.1s; }
    .p6 { top:1vh; left:50%; transform:translateX(-50%); } .p6 img { width:200px; height:170px; border-radius:50% 50% 45% 45%/40% 40% 55% 55%; }
    @keyframes floatImg { 0%,100% { transform:translateY(0px) rotate(-1.5deg); } 50% { transform:translateY(-10px) rotate(1.5deg); } }
    .p6 img { animation:floatImgCenter 4s ease-in-out infinite; animation-delay:0.3s; }
    @keyframes floatImgCenter { 0%,100% { transform:translateY(0px) rotate(-1deg); } 50% { transform:translateY(-10px) rotate(1deg); } }

    .container {
      width:100%; height:100vh; display:flex; align-items:center; justify-content:center;
      flex-direction:column; text-align:center; padding:20px; position:relative; z-index:2;
    }
    .message-box {
      background:rgba(0,0,0,0.28); backdrop-filter:blur(6px);
      border-radius:24px; padding:28px 40px;
      border:1.5px solid rgba(255,255,255,0.18);
      animation:blink 5s ease-in-out infinite;
    }
    @keyframes blink { 0%,40%,60%,100% { opacity:1; } 50% { opacity:0.35; } }
    .message {
      font-size:clamp(1.4rem,3.2vw,3rem); color:#fff; font-weight:bold;
      text-shadow:0 0 20px rgba(144,238,144,0.7),0 2px 8px rgba(0,0,0,0.4);
      animation:floatText 3s ease-in-out infinite; max-width:660px; line-height:1.6;
    }
    .sub { margin-top:16px; color:#d4ffcc; font-size:1.1rem; opacity:0.95; text-shadow:0 1px 6px rgba(0,0,0,0.3); }
    @keyframes floatText { 0%,100% { transform:translateY(0px); } 50% { transform:translateY(-12px); } }

    .icon-fall {
      position:fixed; top:-80px; pointer-events:none; z-index:4;
      user-select:none; line-height:1; animation:fallDown linear infinite;
    }
    @keyframes fallDown {
      0% { transform:translateY(0px) rotate(0deg); opacity:1; }
      90% { opacity:1; }
      100% { transform:translateY(110vh) rotate(360deg); opacity:0; }
    }
  </style>
</head>
